name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - main
      - development
      - vite-update

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: ✅ Verify version.json exists locally
        run: |
          echo "Checking dist directory contents:"
          ls -lah dist/
          echo ""
          echo "version.json content:"
          cat dist/version.json

      # Uploads over FTP (no SSH shell access needed).
      # Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
      # Optional repository variables:
      #   FTP_SERVER_DIR - remote folder, relative to the FTP login folder (default: ./,
      #                    since the Hostinger FTP account logs straight into public_html)
      #   FTP_PROTOCOL   - ftps (default, encrypted) or ftp
      #   SITE_URL       - site to check after deploying (default: https://lymanslogicgames.com)
      # The action keeps a sync-state file on the server so later runs upload only
      # changed files and delete files removed from dist/. The default name
      # (.ftp-deploy-sync-state.json) holds a stale record from an older site, which
      # made every run try to delete folders that no longer exist; using a new name
      # makes the next run start fresh (upload everything, delete nothing).
      - name: 📂 Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .logic-games-sync-state.json

      - name: ✅ Verify deployment
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lymanslogicgames.com' }}
        run: |
          echo "--- Deployed version.json ---"
          deployed=$(curl -fsSL --retry 3 "$SITE_URL/version.json?nocache=$GITHUB_RUN_ID")
          echo "$deployed"
          if echo "$deployed" | grep -q "$GITHUB_SHA"; then
            echo "✅ Site is serving commit $GITHUB_SHA"
          else
            echo "❌ Site is not serving commit $GITHUB_SHA"
            exit 1
          fi
