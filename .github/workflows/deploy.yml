name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - main
      - development
      - vite-update

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: ✅ Verify version.json exists locally
        run: |
          echo "Checking dist directory contents:"
          ls -lah dist/
          echo ""
          echo "version.json content:"
          cat dist/version.json

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📂 Deploy with rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o ConnectTimeout=10" \
            --delete \
            --exclude='.git' \
            dist/ \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home/${{ secrets.FTP_USERNAME }}/public_html/
          
          echo "✅ Rsync complete!"

      - name: ✅ Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -p 65002 ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "echo '--- Files in public_html ---' && \
             ls -lah /home/${{ secrets.FTP_USERNAME }}/public_html/ && \
             echo '' && \
             echo '--- version.json content ---' && \
             cat /home/${{ secrets.FTP_USERNAME }}/public_html/version.json"
