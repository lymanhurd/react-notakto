name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - main
      - development
      - vite-update

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: ✅ Verify version.json exists
        run: |
          echo "Checking dist directory contents:"
          ls -la dist/
          echo ""
          echo "version.json content:"
          cat dist/version.json

      - name: 📂 Sync files
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          TARGET: /home/${{ secrets.FTP_USERNAME }}/public_html/
          REMOTE_PORT: 65002
          SCRIPT_BEFORE: |
            mkdir -p /home/${{ secrets.FTP_USERNAME }}/public_html/
          SCRIPT_AFTER: |
            chmod -R 755 /home/${{ secrets.FTP_USERNAME }}/public_html/
            ls -la /home/${{ secrets.FTP_USERNAME }}/public_html/ | head -20
