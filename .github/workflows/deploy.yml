name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - main
      - development
      - vite-update

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: ✅ Verify version.json exists locally
        run: |
          echo "Checking dist directory contents:"
          ls -lah dist/
          echo ""
          echo "version.json content:"
          cat dist/version.json

      # Uploads over FTP (no SSH shell access needed).
      # Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
      # Optional repository variables:
      #   FTP_SERVER_DIR - remote folder, relative to the FTP login folder (default: public_html/)
      #   FTP_PROTOCOL   - ftps (default, encrypted) or ftp
      #   SITE_URL       - e.g. https://example.com, to check the deploy afterwards
      # The action keeps a .ftp-deploy-sync-state.json file on the server so later
      # runs upload only changed files and delete files removed from dist/.
      - name: 📂 Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}

      - name: ✅ Verify deployment
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "--- Deployed version.json ---"
          deployed=$(curl -fsSL --retry 3 "$SITE_URL/version.json?nocache=$GITHUB_RUN_ID")
          echo "$deployed"
          if echo "$deployed" | grep -q "$GITHUB_SHA"; then
            echo "✅ Site is serving commit $GITHUB_SHA"
          else
            echo "❌ Site is not serving commit $GITHUB_SHA"
            exit 1
          fi
